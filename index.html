<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landen's Bizarre Maze</title>
    <style>
        /* Modern-Retro Atari Aesthetic */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            border: 4px solid #0f0;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
            max-width: 95vw;
            max-height: 90vh;
        }

        /* Hard Mode visual flair */
        #game-container.hard-mode {
            border-color: #f0f;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.5);
        }

        canvas {
            display: block;
            image-rendering: pixelated; 
            background-color: #000;
            max-width: 100%;
            max-height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.9);
            z-index: 10;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 4px 4px #f00;
            text-align: center;
            white-space: pre-wrap;
        }

        .hard-text {
            color: #f0f;
            text-shadow: 4px 4px #fff;
        }

        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 20px 40px;
            font-size: 2rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:hover {
            transform: scale(1.1);
            background: #fff;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <h1 id="ui-title">LANDEN'S BIZARRE MAZE</h1>
            <button id="start-btn">START GAME</button>
        </div>
    </div>

    <script>
        /**
         * LANDEN'S BIZARRE MAZE
         */

        const canvas = document.getElementById('gameCanvas');
        const container = document.getElementById('game-container');
        const ctx = canvas.getContext('2d');
        const uiLayer = document.getElementById('ui-layer');
        const uiTitle = document.getElementById('ui-title');
        const startBtn = document.getElementById('start-btn');

        const TILE_SIZE = 40; 
        const VISIBLE_WIDTH = 20;  
        const VISIBLE_HEIGHT = 15; 
        const FOG_RADIUS = 200;    
        
        let gameState = 'START'; 
        let keys = {};
        let gracePeriodTimer = 0;
        let lastTime = 0; 
        let isHardMode = false;
        
        const world = {
            width: 41,
            height: 41, 
            walls: [],
            fakeWalls: [], 
            exit: {x: 0, y: 0},
            portal: {x: -1, y: -1}, // New: Calculated portal position
            secret: {x: 1, y: -2, collected: false},
            outOfBoundsTiles: [] 
        };

        const player = {
            x: 0,
            y: 0,
            speed: 192, 
            color: '#00f', 
            radius: 12,
            hasSecret: false
        };

        const monster = {
            x: 0,
            y: 0,
            speed: 168, 
            color: '#f00',
            radius: 12,
            path: [],
            lastTargetTile: {x: -1, y: -1}
        };

        const camera = { x: 0, y: 0 };

        function init() {
            canvas.width = VISIBLE_WIDTH * TILE_SIZE;
            canvas.height = VISIBLE_HEIGHT * TILE_SIZE;
            generateMaze();
        }

        function generateMaze() {
            world.width = isHardMode ? 81 : 41;
            world.height = isHardMode ? 81 : 41;
            
            world.walls = [];
            world.fakeWalls = [];
            
            if (!isHardMode) {
                world.secret.collected = false;
                player.hasSecret = false;
                player.color = '#00f';
            } else {
                player.color = '#f0f';
            }

            for (let y = 0; y < world.height; y++) {
                world.walls[y] = new Array(world.width).fill(true);
            }

            for (let y = 1; y < 7; y++) {
                for (let x = 1; x < 6; x++) {
                    world.walls[y][x] = false;
                }
            }

            if (!isHardMode) {
                world.outOfBoundsTiles = [
                    {x: 1, y: -1, wall: false},  
                    {x: 1, y: -2, wall: false, hasSecret: true}, 
                    {x: 0, y: -1, wall: true},
                    {x: 0, y: -2, wall: true},
                    {x: 2, y: -1, wall: true},
                    {x: 2, y: -2, wall: true},
                    {x: 1, y: -3, wall: true}
                ];
                world.walls[0][1] = true; 
                world.fakeWalls.push({x: 1, y: 0});
            } else {
                world.outOfBoundsTiles = [];
            }

            const stack = [{x: 5, y: 3}];
            world.walls[3][5] = false;

            while (stack.length > 0) {
                const curr = stack[stack.length - 1];
                const dirs = [{x:0, y:-2}, {x:0, y:2}, {x:-2, y:0}, {x:2, y:0}].sort(() => Math.random() - 0.5);
                let found = false;

                for (let d of dirs) {
                    const nx = curr.x + d.x, ny = curr.y + d.y;
                    if (nx > 0 && nx < world.width-1 && ny > 0 && ny < world.height-1 && world.walls[ny][nx]) {
                        world.walls[curr.y + d.y/2][curr.x + d.x/2] = false;
                        world.walls[ny][nx] = false;
                        stack.push({x: nx, y: ny});
                        found = true;
                        break;
                    }
                }
                if (!found) stack.pop();
            }

            const loopCount = isHardMode ? 400 : 150;
            for (let i = 0; i < loopCount; i++) {
                const rx = Math.floor(Math.random() * (world.width - 2)) + 1;
                const ry = Math.floor(Math.random() * (world.height - 2)) + 1;
                if (world.walls[ry][rx]) {
                    const h = !world.walls[ry][rx-1] && !world.walls[ry][rx+1];
                    const v = !world.walls[ry-1][rx] && !world.walls[ry+1][rx];
                    if (h || v) world.walls[ry][rx] = false;
                }
            }

            // Exit Placement
            let exitFound = false;
            const startX = 3, startY = 4;
            const minDistance = isHardMode ? 100 : 30; 
            let attempts = 0;
            while (!exitFound && attempts < 1000) {
                attempts++;
                const ex = isHardMode 
                    ? Math.floor(world.width * 0.7 + Math.random() * (world.width * 0.25))
                    : Math.floor(Math.random() * (world.width - 2)) + 1;
                const ey = isHardMode 
                    ? Math.floor(world.height * 0.7 + Math.random() * (world.height * 0.25))
                    : Math.floor(Math.random() * (world.height - 2)) + 1;
                
                if (ex < world.width && ey < world.height && !world.walls[ey][ex]) {
                    if ((Math.abs(ex - startX) + Math.abs(ey - startY)) > minDistance) {
                        world.exit = {x: ex, y: ey};
                        exitFound = true;
                    }
                }
            }

            // Portal Placement: Edge wall, far from spawn
            if (!isHardMode) {
                let edges = [];
                for(let i=0; i<world.width; i++) {
                    if(world.walls[0][i]) edges.push({x: i, y: 0});
                    if(world.walls[world.height-1][i]) edges.push({x: i, y: world.height-1});
                }
                for(let i=0; i<world.height; i++) {
                    if(world.walls[i][0]) edges.push({x: 0, y: i});
                    if(world.walls[i][world.width-1]) edges.push({x: world.width-1, y: i});
                }
                // Filter for blocks far from spawn (startX=3, startY=4)
                const farEdges = edges.filter(e => (Math.abs(e.x - startX) + Math.abs(e.y - startY)) > 25);
                if (farEdges.length > 0) {
                    world.portal = farEdges[Math.floor(Math.random() * farEdges.length)];
                } else {
                    world.portal = {x: world.width - 1, y: world.height - 1};
                }
            }
        }

        function getPath(startX, startY, endX, endY) {
            if (startY < 0 || endY < 0) return []; 
            const queue = [[{x: startX, y: startY}]];
            const visited = new Set([`${startX},${startY}`]);
            
            while (queue.length > 0) {
                const path = queue.shift();
                const curr = path[path.length - 1];
                if (curr.x === endX && curr.y === endY) return path;

                const dirs = [{x:0, y:1}, {x:0, y:-1}, {x:1, y:0}, {x:-1, y:0}];
                for (let d of dirs) {
                    const nx = curr.x + d.x, ny = curr.y + d.y;
                    if (nx >= 0 && nx < world.width && ny >= 0 && ny < world.height && !world.walls[ny][nx] && !visited.has(`${nx},${ny}`)) {
                        visited.add(`${nx},${ny}`);
                        queue.push([...path, {x: nx, y: ny}]);
                    }
                }
            }
            return [];
        }

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function triggerHardMode() {
            isHardMode = true;
            container.classList.add('hard-mode');
            uiTitle.innerHTML = "HARD MODE ACTIVATED";
            uiTitle.classList.add('hard-text');
            uiLayer.classList.remove('hidden');
            startBtn.innerText = "ENTER THE PINK MAZE";
            gameState = 'TRANSITION';
            monster.speed = 185; 
        }

        startBtn.addEventListener('click', () => {
            uiLayer.classList.add('hidden');
            if (gameState === 'START' || gameState === 'LOST' || gameState === 'WON') {
                isHardMode = false;
                container.classList.remove('hard-mode');
                uiTitle.classList.remove('hard-text');
                uiTitle.innerText = "LANDEN'S BIZARRE MAZE";
                monster.speed = 168;
            }
            
            generateMaze();
            player.x = TILE_SIZE * 3.5;
            player.y = TILE_SIZE * 4.5;
            monster.x = TILE_SIZE * 3.5;
            monster.y = TILE_SIZE * 2.5;
            monster.path = [];
            gracePeriodTimer = 3.0; 
            gameState = 'PLAYING';
            lastTime = performance.now(); 
        });

        function checkCollision(nx, ny, radius, isMonster = false) {
            const res = 12; 
            const inset = 1; 
            for (let i = 0; i < res; i++) {
                const angle = (i / res) * Math.PI * 2;
                const px = nx + Math.cos(angle) * (radius - inset);
                const py = ny + Math.sin(angle) * (radius - inset);
                const tx = Math.floor(px / TILE_SIZE), ty = Math.floor(py / TILE_SIZE);
                
                if (ty < 0) {
                    if (isMonster) return true;
                    const oob = world.outOfBoundsTiles.find(t => t.x === tx && t.y === ty);
                    if (!oob || oob.wall) return true;
                    continue;
                }

                if (tx < 0 || tx >= world.width || ty >= world.height) return true;
                
                if (world.walls[ty][tx]) {
                    // Normal mode: check if it's the portal after collecting secret
                    if (!isMonster && player.hasSecret && tx === world.portal.x && ty === world.portal.y) {
                        return false; 
                    }
                    if (!isMonster && world.fakeWalls.some(fw => fw.x === tx && fw.y === ty)) continue;
                    return true;
                }
            }
            return false;
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;

            let moveX = 0, moveY = 0;
            if (keys['ArrowUp'] || keys['KeyW']) moveY -= player.speed * dt;
            if (keys['ArrowDown'] || keys['KeyS']) moveY += player.speed * dt;
            if (keys['ArrowLeft'] || keys['KeyA']) moveX -= player.speed * dt;
            if (keys['ArrowRight'] || keys['KeyD']) moveX += player.speed * dt;

            if (moveX !== 0 && moveY !== 0) {
                moveX *= 0.7071;
                moveY *= 0.7071;
            }

            if (!checkCollision(player.x + moveX, player.y + moveY, player.radius)) {
                player.x += moveX;
                player.y += moveY;
            } else {
                if (!checkCollision(player.x + moveX, player.y, player.radius)) player.x += moveX;
                if (!checkCollision(player.x, player.y + moveY, player.radius)) player.y += moveY;
            }

            if (gracePeriodTimer > 0) {
                gracePeriodTimer -= dt;
            } else {
                const pTileX = Math.floor(player.x / TILE_SIZE);
                const pTileY = Math.floor(player.y / TILE_SIZE);
                const mTileX = Math.floor(monster.x / TILE_SIZE);
                const mTileY = Math.floor(monster.y / TILE_SIZE);

                if (pTileY >= 0) {
                    if (monster.path.length === 0 || monster.lastTargetTile.x !== pTileX || monster.lastTargetTile.y !== pTileY) {
                        monster.path = getPath(mTileX, mTileY, pTileX, pTileY);
                        monster.lastTargetTile = {x: pTileX, y: pTileY};
                    }

                    if (monster.path.length > 1) {
                        const next = monster.path[1];
                        const targetX = (next.x + 0.5) * TILE_SIZE;
                        const targetY = (next.y + 0.5) * TILE_SIZE;
                        const angle = Math.atan2(targetY - monster.y, targetX - monster.x);
                        
                        monster.x += Math.cos(angle) * monster.speed * dt;
                        monster.y += Math.sin(angle) * monster.speed * dt;
                        
                        if (Math.hypot(targetX - monster.x, targetY - monster.y) < 5) monster.path.shift();
                    }
                }

                if (Math.hypot(monster.x - player.x, monster.y - player.y) < 22) {
                    gameState = 'LOST';
                    uiTitle.innerText = "YOU WERE CAUGHT!";
                    uiTitle.classList.remove('hard-text');
                    startBtn.innerText = "TRY AGAIN";
                    uiLayer.classList.remove('hidden');
                }
            }

            const tx = Math.floor(player.x / TILE_SIZE);
            const ty = Math.floor(player.y / TILE_SIZE);
            
            if (!world.secret.collected && !isHardMode) {
                const secretTile = world.outOfBoundsTiles.find(t => t.hasSecret);
                if (tx === secretTile.x && ty === secretTile.y) {
                    world.secret.collected = true;
                    player.hasSecret = true;
                    player.color = '#f0f'; 
                }
            }

            // Hard Mode Portal Logic
            if (player.hasSecret && !isHardMode && tx === world.portal.x && ty === world.portal.y) {
                triggerHardMode();
            }

            if (tx === world.exit.x && ty === world.exit.y) {
                gameState = 'WON';
                uiTitle.innerText = isHardMode ? "GOD TIER ESCAPE!" : (player.hasSecret ? "YOU ESCAPED!\n(A+ CERTIFIED)" : "YOU ESCAPED!");
                uiTitle.classList.remove('hard-text');
                startBtn.innerText = "PLAY AGAIN";
                uiLayer.classList.remove('hidden');
            }

            camera.x = player.x - canvas.width / 2;
            camera.y = player.y - canvas.height / 2;
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const pTileY = Math.floor(player.y / TILE_SIZE);
            const isInsideSecretCorridor = pTileY < 0;

            ctx.save();
            ctx.translate(-camera.x, -camera.y);

            // Walls
            for (let y = 0; y < world.height; y++) {
                for (let x = 0; x < world.width; x++) {
                    if (world.walls[y][x]) {
                        let wallColor = isHardMode ? '#f0f' : '#00ff00';
                        
                        // Override color for entrance or portal
                        const isEntrance = world.fakeWalls.some(fw => fw.x === x && fw.y === y);
                        if (isEntrance) wallColor = '#00cc00';
                        if (player.hasSecret && !isHardMode && x === world.portal.x && y === world.portal.y) {
                             wallColor = '#f0f';
                        }

                        ctx.fillStyle = wallColor;
                        ctx.fillRect(x * TILE_SIZE + 2, y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    }
                }
            }

            if (isInsideSecretCorridor) {
                world.outOfBoundsTiles.forEach(t => {
                    if (t.wall) {
                        ctx.fillStyle = '#00ff00';
                        ctx.fillRect(t.x * TILE_SIZE + 2, t.y * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                    } else if (t.hasSecret && !world.secret.collected) {
                        ctx.fillStyle = '#fff';
                        ctx.font = '24px Arial';
                        ctx.fillText('📄', t.x * TILE_SIZE + 8, t.y * TILE_SIZE + 30);
                    }
                });
            }

            // Exit
            ctx.fillStyle = (Math.floor(Date.now() / 200) % 2 === 0) ? '#fff' : (isHardMode ? '#f0f' : '#0f0');
            ctx.fillRect(world.exit.x * TILE_SIZE + 5, world.exit.y * TILE_SIZE + 5, TILE_SIZE - 10, TILE_SIZE - 10);

            // Entities
            ctx.fillStyle = monster.color;
            ctx.fillRect(monster.x - 12, monster.y - 12, 24, 24);
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x - 10, player.y - 10, 20, 20);

            ctx.restore();

            const cx = canvas.width / 2, cy = canvas.height / 2;
            ctx.globalCompositeOperation = 'destination-in';
            const grad = ctx.createRadialGradient(cx, cy, FOG_RADIUS * 0.2, cx, cy, FOG_RADIUS);
            grad.addColorStop(0, 'rgba(0,0,0,1)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.beginPath(); ctx.arc(cx, cy, FOG_RADIUS, 0, Math.PI*2); ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
        }

        function gameLoop(time) {
            const deltaTime = (time - lastTime) / 1000; 
            lastTime = time;
            const cappedDt = Math.min(deltaTime, 0.1); 
            update(cappedDt); 
            draw();           
            requestAnimationFrame(gameLoop);
        }

        init();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
