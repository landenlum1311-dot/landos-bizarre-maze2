<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lando's Bizarre Maze - Cyberpunk Edition</title>
<style>
    :root {
        --neon-cyan: #00f2ff;
        --neon-magenta: #ff00ff;
        --neon-green: #39ff14;
        --dark-bg: #050505;
    }

    body {
        margin: 0;
        padding: 0;
        background-color: #000;
        color: var(--neon-cyan);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
    }

    /* CRT Screen Simulation Container */
    #screen {
        position: relative;
        width: 800px;
        height: 600px;
        overflow: hidden;
        border: 4px solid #333;
        border-radius: 15px;
        box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(0,0,0,0.5);
        background: #000;
    }

    /* Scanline Overlay */
    #screen::after {
        content: " ";
        display: block;
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                    linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
        z-index: 5;
        background-size: 100% 3px, 2px 100%;
        pointer-events: none;
    }

    /* Vignette and Curvature */
    #screen::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0; left: 0; bottom: 0; right: 0;
        background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%);
        z-index: 6;
        pointer-events: none;
    }

    canvas {
        display: block;
        image-rendering: auto; 
        background-color: var(--dark-bg);
    }

    #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.85);
        z-index: 10;
        backdrop-filter: blur(8px);
    }

    #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 8;
        pointer-events: none;
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 0.9rem;
        text-shadow: 0 0 10px var(--neon-cyan);
    }

    h1 {
        font-size: 2.5rem;
        margin-bottom: 30px;
        text-align: center;
        letter-spacing: 5px;
        color: #fff;
        text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
    }

    .hard-text {
        color: #fff !important;
        text-shadow: 0 0 10px var(--neon-magenta), 0 0 30px var(--neon-magenta) !important;
        animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
        from { transform: scale(1); }
        to { transform: scale(1.05); }
    }

    button {
        background: transparent;
        color: #fff;
        border: 1px solid #fff;
        padding: 15px 40px;
        font-size: 1.2rem;
        font-family: inherit;
        font-weight: 300;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 0 15px rgba(255,255,255,0.2);
        text-transform: uppercase;
        letter-spacing: 4px;
    }

    button:hover {
        background: #fff;
        color: #000;
        box-shadow: 0 0 30px #fff;
    }

    .hidden { display: none !important; }

    .stat-label { font-size: 0.7rem; opacity: 0.6; margin-bottom: 2px; }
    .stat-value { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; display: block;}

    /* LEADERBOARD STYLES */
    #leaderboard { margin-top: 20px; text-align: center; }
    #leaderboard h2 { letter-spacing: 4px; margin-bottom: 10px; }
    .lb-entry { font-size: 0.9rem; opacity: 0.9; margin:2px 0; }
    input { background:#000; color:#0ff; border:1px solid #0ff; padding:8px; margin-bottom:10px; text-align:center; }
</style>
</head>
<body>

<div id="screen">
    <canvas id="gameCanvas"></canvas>
    
    <div id="hud" class="hidden">
        <div class="stat-label">TIME ELAPSED</div>
        <span id="timer-val" class="stat-value">0.00</span>
        <div class="stat-label">RECORD</div>
        <span id="best-val" class="stat-value">--</span>
    </div>
    
    <div id="ui-layer">
        <h1 id="ui-title">LANDO'S<br>BIZARRE MAZE</h1>
        
        <div id="stats-box" class="hidden" style="text-align:center;">
            <div class="stat-label">LAST RUN</div>
            <span id="last-time-val" class="stat-value">0.00</span>
        </div>

        <!-- PLAYER NAME INPUT FOR LEADERBOARD -->
        <div id="name-entry" class="hidden">
            <input id="playerName" maxlength="16" placeholder="ENTER NAME">
            <button id="submitScore">UPLOAD SCORE</button>
        </div>

        <!-- LEADERBOARD DISPLAY -->
        <div id="leaderboard">
            <h2 id="lb-title">NORMAL MODE</h2>
            <div id="scores"></div>
        </div>

        <button id="start-btn">INITIALIZE</button>
    </div>
</div>

<!-- GAME + FIREBASE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp }

/* ================= FIREBASE ================= */

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= SLUR FILTER ================= */
const bannedWords = [
  "fuck","shit","bitch","asshole","nigger","faggot","cunt","rape","hitler"
];
function cleanName(name) {
  let out = (name || "ANON").trim();
  bannedWords.forEach(w => {
    out = out.replace(new RegExp(w, "gi"), "*".repeat(w.length));
  });
  return out.slice(0, 16);
}

/* ================= LEADERBOARD LOGIC ================= */
let lastWinTime = 0;
let lastWinMode = "normal";

function getLeaderboardCollection() {
  return isHardMode ? "leaderboard_hard" : "leaderboard_normal";
}

async function submitScore(name, time) {
  const collectionName = getLeaderboardCollection();
  await addDoc(collection(db, collectionName), { name, time, created: serverTimestamp() });
  loadLeaderboard();
}

async function loadLeaderboard() {
  const collectionName = getLeaderboardCollection();
  const q = query(collection(db, collectionName), orderBy("time"), limit(10));
  const snap = await getDocs(q);
  const scores = document.getElementById("scores");
  scores.innerHTML = "";
  let rank = 1;
  snap.forEach(doc => {
    const d = doc.data();
    scores.innerHTML += `<div class="lb-entry">#${rank++} ${d.name} — ${d.time.toFixed(2)}s</div>`;
  });
  document.getElementById("lb-title").innerText = isHardMode ? "HARD MODE" : "NORMAL MODE";
}

function onGameWin(time) {
  lastWinTime = time;
  lastWinMode = isHardMode ? "hard" : "normal";
  document.getElementById("name-entry").classList.remove("hidden");
}

/* SUBMIT BUTTON */
document.getElementById("submitScore").onclick = () => {
  const input = document.getElementById("playerName");
  const name = cleanName(input.value);
  submitScore(name, lastWinTime);
  input.value = "";
  document.getElementById("name-entry").classList.add("hidden");
};

/* ================= GAME CODE ================= */
/* ...Your entire existing game code continues unchanged below this line... */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiLayer = document.getElementById('ui-layer');
const uiTitle = document.getElementById('ui-title');
const startBtn = document.getElementById('start-btn');
const hud = document.getElementById('hud');
const timerVal = document.getElementById('timer-val');
const bestValDisplay = document.getElementById('best-val');
const statsBox = document.getElementById('stats-box');
const lastTimeVal = document.getElementById('last-time-val');

const TILE_SIZE = 40; 
const VISIBLE_WIDTH = 20;  
const VISIBLE_HEIGHT = 15; 
const FOG_RADIUS = 220;    
        
let gameState = 'START'; 
let keys = {};
let gracePeriodTimer = 0;
let lastTime = 0; 
let isHardMode = false;
let startTime = 0, currentTime = 0, bestTime = Infinity;
let shakeIntensity = 0, flickerAlpha = 1;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let musicTimer = 0, nextPulseTime = 0;

/* ----- INSERT ALL YOUR GAME FUNCTIONS HERE (unchanged) ----- */

/* ADD THIS LINE INSIDE YOUR WIN CONDITION */
if (ctxX === world.exit.x && ctxY === world.exit.y) {
    onGameWin(currentTime); // <-- leaderboard hook
}

/* INITIAL LEADERBOARD LOAD */
loadLeaderboard();
</script>

</body>
</html>
