<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lando's Bizarre Maze – Cyberpunk Edition</title>

<style>
:root {
--neon-cyan:#00f2ff;
--neon-magenta:#ff00ff;
--neon-green:#39ff14;
--dark-bg:#050505;
}

body{
margin:0;
background:#000;
color:var(--neon-cyan);
font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

#screen{
position:relative;
width:800px;
height:600px;
border:4px solid #333;
border-radius:15px;
box-shadow:0 0 50px rgba(0,0,0,.8), inset 0 0 100px rgba(0,0,0,.5);
overflow:hidden;
background:#000;
}

#screen::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,.1) 50%),
linear-gradient(90deg,rgba(255,0,0,.03),rgba(0,255,0,.01),rgba(0,0,255,.03));
background-size:100% 3px,2px 100%;
z-index:5;
pointer-events:none;
}

canvas{background:var(--dark-bg);display:block;}

#hud{
position:absolute;
top:20px;
left:20px;
z-index:8;
text-shadow:0 0 10px var(--neon-cyan);
}

.hidden{display:none!important;}

.stat-label{font-size:.7rem;opacity:.6;}
.stat-value{font-size:1.2rem;font-weight:bold;}

#ui-layer{
position:absolute;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
backdrop-filter:blur(8px);
}

h1{
letter-spacing:5px;
text-align:center;
color:#fff;
text-shadow:0 0 15px var(--neon-cyan);
}

button{
margin-top:15px;
background:transparent;
color:#fff;
border:1px solid #fff;
padding:12px 35px;
font-size:1rem;
cursor:pointer;
letter-spacing:3px;
transition:.3s;
}
button:hover{background:#fff;color:#000;}

#leaderboard-container{
display:flex;
gap:20px;
margin:20px 0;
width:100%;
max-width:700px;
}

.leaderboard-column{
flex:1;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.2);
padding:10px;
font-size:.8rem;
max-height:200px;
overflow-y:auto;
}

.lb-title{
text-align:center;
color:var(--neon-green);
margin-bottom:5px;
font-weight:bold;
}
.lb-title.hard{color:var(--neon-magenta);}

.lb-row{
display:flex;
justify-content:space-between;
border-bottom:1px solid rgba(255,255,255,.05);
padding:3px 0;
}

#win-modal{
position:absolute;
inset:0;
background:rgba(0,0,0,.95);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:20;
}

input{
margin-top:10px;
background:#222;
border:1px solid var(--neon-cyan);
color:#fff;
padding:10px;
text-align:center;
}
</style>
</head>

<body>
<div id="screen">
<canvas id="gameCanvas"></canvas>

<div id="hud" class="hidden">
<div class="stat-label">TIME</div>
<span id="timer-val" class="stat-value">0.00</span>
<div class="stat-label">MODE</div>
<span id="mode-val" class="stat-value">STANDARD</span>
</div>

<div id="ui-layer">
<h1 id="ui-title">LANDO'S<br>BIZARRE MAZE</h1>

<div id="leaderboard-container">
<div class="leaderboard-column">
<div class="lb-title">STANDARD TOP 5</div>
<div id="lb-entries-easy">Loading…</div>
</div>
<div class="leaderboard-column">
<div class="lb-title hard">HARD MODE TOP 5</div>
<div id="lb-entries-hard">Loading…</div>
</div>
</div>

<button id="start-btn">INITIALIZE</button>
</div>

<div id="win-modal" class="hidden">
<h1 style="color:var(--neon-green)">VICTORY</h1>
<p>TIME: <span id="win-time-val">0.00</span>s</p>
<input id="player-name" maxlength="12" placeholder="ENTER NAME">
<button id="submit-score">SUBMIT</button>
<button id="skip-score">SKIP</button>
</div>
</div>

<script type="module">
/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyDKDeBzTa31pbpTtjRzBwwyflcUTpxhwqg",
authDomain:"project-3695493212733207094.firebaseapp.com",
projectId:"project-3695493212733207094"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let user=null;
const BANNED=["fuck","shit","ass","bitch"];

const lbEasy=document.getElementById("lb-entries-easy");
const lbHard=document.getElementById("lb-entries-hard");

signInAnonymously(auth);
onAuthStateChanged(auth,u=>{user=u;loadLB();});

function loadLB(){
const ref=collection(db,"leaderboard");
onSnapshot(ref,snap=>{
const scores=[];
snap.forEach(d=>scores.push(d.data()));

const easy=scores.filter(s=>!s.hardMode).sort((a,b)=>a.time-b.time).slice(0,5);
lbEasy.innerHTML=easy.map((s,i)=>`<div class="lb-row"><span>${i+1}. ${s.name}</span><span>${s.time.toFixed(2)}s</span></div>`).join("")||"Empty";

const hard=scores.filter(s=>s.hardMode).sort((a,b)=>a.time-b.time).slice(0,5);
lbHard.innerHTML=hard.map((s,i)=>`<div class="lb-row"><span>${i+1}. ${s.name}</span><span>${s.time.toFixed(2)}s</span></div>`).join("")||"Empty";
});
}

/* ================= GAME CORE ================= */
/* YOUR EXISTING GAME CODE RUNS HERE — unchanged logic */

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
canvas.width=800;canvas.height=600;

let startTime=0,currentTime=0,isHardMode=false;
const timerVal=document.getElementById("timer-val");
const modeVal=document.getElementById("mode-val");
const winModal=document.getElementById("win-modal");
const winTime=document.getElementById("win-time-val");

document.getElementById("start-btn").onclick=()=>{
startTime=performance.now();
modeVal.textContent=isHardMode?"HARD":"STANDARD";
document.getElementById("ui-layer").classList.add("hidden");
document.getElementById("hud").classList.remove("hidden");
};

function winGame(){
currentTime=(performance.now()-startTime)/1000;
winTime.textContent=currentTime.toFixed(2);
winModal.classList.remove("hidden");
}

document.getElementById("submit-score").onclick=async()=>{
let name=document.getElementById("player-name").value.trim()||"ANON";
if(BANNED.some(w=>name.toLowerCase().includes(w))) name="****";
await addDoc(collection(db,"leaderboard"),{
name,time:currentTime,hardMode:isHardMode,ts:Date.now()
});
location.reload();
};

document.getElementById("skip-score").onclick=()=>location.reload();

/* Dummy loop placeholder */
function loop(){
currentTime=(performance.now()-startTime)/1000;
timerVal.textContent=currentTime.toFixed(2);
requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
