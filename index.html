<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lando's Bizarre Maze - Cyberpunk Edition</title>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --dark-bg: #050505;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--neon-cyan);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #screen {
            position: relative;
            width: 800px;
            height: 600px;
            overflow: hidden;
            border: 4px solid #333;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(0,0,0,0.5);
            background: #000;
        }

        #screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 5;
            background-size: 100% 3px, 2px 100%;
            pointer-events: none;
        }

        #screen::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: radial-gradient(circle, rgba(0,0,0,0) 50%, rgba(0,0,0,0.6) 100%);
            z-index: 6;
            pointer-events: none;
        }

        canvas {
            display: block;
            image-rendering: auto; 
            background-color: var(--dark-bg);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 8;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
        }

        .hard-text {
            color: #fff !important;
            text-shadow: 0 0 10px var(--neon-magenta), 0 0 30px var(--neon-magenta) !important;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        button {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        button:hover {
            background: #fff;
            color: #000;
            box-shadow: 0 0 30px #fff;
        }

        .hidden { display: none !important; }

        .stat-label { font-size: 0.7rem; opacity: 0.6; margin-bottom: 2px; }
        .stat-value { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; display: block;}
    </style>
</head>
<body>
    <div id="screen">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud" class="hidden">
            <div class="stat-label">TIME ELAPSED</div>
            <span id="timer-val" class="stat-value">0.00</span>
            <div class="stat-label">RECORD</div>
            <span id="best-val" class="stat-value">--</span>
        </div>
        
        <div id="ui-layer">
            <h1 id="ui-title">LANDO'S<br>BIZARRE MAZE</h1>
            <div id="stats-box" class="hidden" style="text-align:center;">
                <div class="stat-label">LAST RUN</div>
                <span id="last-time-val" class="stat-value">0.00</span>
            </div>
            <button id="start-btn">INITIALIZE</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const uiLayer = document.getElementById('ui-layer');
            const uiTitle = document.getElementById('ui-title');
            const startBtn = document.getElementById('start-btn');
            const hud = document.getElementById('hud');
            const timerVal = document.getElementById('timer-val');
            const bestValDisplay = document.getElementById('best-val');
            const statsBox = document.getElementById('stats-box');
            const lastTimeVal = document.getElementById('last-time-val');

            // === all your existing JS variables and functions go here ===
            const TILE_SIZE = 40; 
            const VISIBLE_WIDTH = 20;  
            const VISIBLE_HEIGHT = 15; 
            const FOG_RADIUS = 220;    

            let gameState = 'START'; 
            let keys = {};
            let gracePeriodTimer = 0;
            let lastTime = 0; 
            let isHardMode = false;
            let startTime = 0, currentTime = 0, bestTime = Infinity;
            let shakeIntensity = 0, flickerAlpha = 1;

            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let musicTimer = 0, nextPulseTime = 0;

            // ... all your functions like playTone, playThump, generateMaze, getPath, etc. ...

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            startBtn.addEventListener('click', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                uiLayer.classList.add('hidden'); hud.classList.remove('hidden'); statsBox.classList.add('hidden');
                if (gameState !== 'TRANSITION') {
                    isHardMode = false; uiTitle.classList.remove('hard-text');
                    uiTitle.innerHTML = "LANDO'S<br>BIZARRE MAZE"; 
                    monster.speed = 170; startTime = performance.now();
                }
                generateMaze();
                player.x = TILE_SIZE * 3.5; player.y = TILE_SIZE * 4.5;
                monster.x = TILE_SIZE * 3.5; monster.y = TILE_SIZE * 2.5;
                monster.path = []; gracePeriodTimer = 3.0; 
                gameState = 'PLAYING'; lastTime = performance.now(); 
                playTone(440, 'sine', 0.1, 0.4);
            });

            function init() {
                canvas.width = 800;
                canvas.height = 600;
                generateMaze();
            }

            function loop(t) { 
                update(Math.min((t - lastTime) / 1000, 0.1)); 
                draw(); 
                lastTime = t; 
                requestAnimationFrame(loop); 
            }

            init(); 
            requestAnimationFrame(loop);
        });
    </script>
</body>
</html>
