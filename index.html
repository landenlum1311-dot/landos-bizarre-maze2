<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lando's Bizarre Maze - Cyberpunk Edition</title>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-magenta: #ff00ff;
            --neon-green: #39ff14;
            --dark-bg: #050505;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: var(--neon-cyan);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #screen {
            position: relative;
            width: 800px;
            height: 600px;
            overflow: hidden;
            border: 4px solid #333;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 100px rgba(0,0,0,0.5);
            background: #000;
        }

        #screen::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
            z-index: 5;
            background-size: 100% 3px, 2px 100%;
            pointer-events: none;
        }

        canvas {
            display: block;
            image-rendering: auto; 
            background-color: var(--dark-bg);
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 10;
            backdrop-filter: blur(8px);
            padding: 20px;
            box-sizing: border-box;
        }

        #hud {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 8;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            text-shadow: 0 0 10px var(--neon-cyan);
        }

        .menu-btn-small {
            background: rgba(0, 242, 255, 0.1);
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 5px 10px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.2s;
        }

        .menu-btn-small:hover {
            background: var(--neon-cyan);
            color: #000;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 5px;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
        }

        #leaderboard-container {
            display: flex;
            gap: 20px;
            width: 100%;
            max-width: 700px;
            margin: 20px 0;
        }

        .leaderboard-column {
            flex: 1;
            font-size: 0.8rem;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px;
            background: rgba(255,255,255,0.05);
            max-height: 200px;
            overflow-y: auto;
        }

        .lb-title { text-align: center; color: var(--neon-green); margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
        .lb-title.hard { color: var(--neon-magenta); }
        .lb-row { display: flex; justify-content: space-between; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

        input {
            background: #222;
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 10px;
            font-family: inherit;
            text-align: center;
            outline: none;
        }

        button {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 12px 30px;
            font-size: 1rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover { background: #fff; color: #000; box-shadow: 0 0 20px #fff; }

        .hidden { display: none !important; }
        .stat-label { font-size: 0.7rem; opacity: 0.6; margin-bottom: 2px; }
        .stat-value { font-size: 1.2rem; font-weight: bold; margin-bottom: 10px; display: block;}
    </style>
</head>
<body>

    <div id="screen">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud" class="hidden">
            <div class="hud-content">
                <div class="stat-label">TIME ELAPSED</div>
                <span id="timer-val" class="stat-value">0.00</span>
                <div class="stat-label">MODE</div>
                <span id="mode-val" class="stat-value">STANDARD</span>
            </div>
            <button id="menu-btn" class="menu-btn-small">BACK TO MENU</button>
        </div>
        
        <div id="ui-layer">
            <h1 id="ui-title">LANDO'S BIZARRE MAZE</h1>
            <div id="leaderboard-container">
                <div class="leaderboard-column">
                    <div class="lb-title">Standard Top 5</div>
                    <div id="lb-entries-easy">Loading...</div>
                </div>
                <div class="leaderboard-column">
                    <div class="lb-title hard">Hard Mode Top 5</div>
                    <div id="lb-entries-hard">Loading...</div>
                </div>
            </div>
            <button id="start-btn">INITIALIZE</button>
        </div>

        <div id="win-modal" class="hidden" style="background: rgba(0,0,0,0.95); position: absolute; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20;">
            <h1 id="win-header" style="color: var(--neon-green)">VICTORY</h1>
            <p id="win-subheader">ESCAPE COMPLETED</p>
            <p>TIME: <span id="win-time-val">0.00</span>s</p>
            <input type="text" id="player-name" placeholder="ENTER YOUR NAME" maxlength="12">
            <button id="submit-score" style="margin-top: 20px;">SUBMIT SCORE</button>
            <button id="skip-score" style="border:none; font-size: 0.7rem; margin-top:10px; opacity:0.6;">SKIP</button>
        </div>
    </div>

    <script type="module">
/* =========================
   FIREBASE IMPORTS (CDN)
   ========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

/* =========================
   FIREBASE CONFIG
   ========================= */
const firebaseConfig = {
  apiKey: "AIzaSyDKDeBzTa31pbpTtjRzBwwyflcUTpxhwqg",
  authDomain: "project-3695493212733207094.firebaseapp.com",
  projectId: "project-3695493212733207094",
  storageBucket: "project-3695493212733207094.firebasestorage.app",
  messagingSenderId: "220486711904",
  appId: "1:220486711904:web:3a5bac5cbc5e969a162105"
};

/* =========================
   FIREBASE INIT
   ========================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const appId = "github-pages";

let user = null;

signInAnonymously(auth).catch(console.error);

onAuthStateChanged(auth, (u) => {
    user = u;
    if (user) fetchLeaderboard();
});

/* =========================
   GAME VARIABLES
   ========================= */
const BANNED_WORDS = ['fuck', 'shit', 'ass', 'bitch'];

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const uiLayer = document.getElementById('ui-layer');
const winModal = document.getElementById('win-modal');
const uiTitle = document.getElementById('ui-title');
const startBtn = document.getElementById('start-btn');
const menuBtn = document.getElementById('menu-btn');
const hud = document.getElementById('hud');

const timerVal = document.getElementById('timer-val');
const modeVal = document.getElementById('mode-val');

const lbEntriesEasy = document.getElementById('lb-entries-easy');
const lbEntriesHard = document.getElementById('lb-entries-hard');

const TILE_SIZE = 40;
const FOG_RADIUS = 220;

let gameState = 'START';
let keys = {};
let gracePeriodTimer = 0;
let lastTime = 0;
let isHardMode = false;
let startTime = 0, currentTime = 0;
let shakeIntensity = 0, flickerAlpha = 1;

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let musicTimer = 0, nextPulseTime = 0;

/* =========================
   LEADERBOARD
   ========================= */
async function fetchLeaderboard() {
    if (!db || !user) return;

    const lbRef = collection(db, 'leaderboard');

    onSnapshot(lbRef, (snapshot) => {
        const scores = [];
        snapshot.forEach(doc => scores.push(doc.data()));

        const easy = scores.filter(s => !s.hardMode)
            .sort((a,b) => a.time - b.time)
            .slice(0,5);

        const hard = scores.filter(s => s.hardMode)
            .sort((a,b) => a.time - b.time)
            .slice(0,5);

        lbEntriesEasy.innerHTML = easy.length
            ? easy.map((s,i)=>`<div class="lb-row"><span>${i+1}. ${s.name}</span><span>${s.time.toFixed(2)}s</span></div>`).join('')
            : '<div style="opacity:.5;text-align:center">Empty</div>';

        lbEntriesHard.innerHTML = hard.length
            ? hard.map((s,i)=>`<div class="lb-row"><span>${i+1}. ${s.name}</span><span>${s.time.toFixed(2)}s</span></div>`).join('')
            : '<div style="opacity:.5;text-align:center">Empty</div>';
    });
}

async function submitScore() {
    let name = document.getElementById('player-name').value.trim() || "ANONYMOUS";
    if (BANNED_WORDS.some(w => name.toLowerCase().includes(w))) name = "****";

    try {
        await addDoc(collection(db, 'leaderboard'), {
            name,
            time: currentTime,
            hardMode: isHardMode,
            timestamp: Date.now()
        });
    } catch (e) {
        console.error(e);
    }

    winModal.classList.add('hidden');
    resetToMenu();
}

/* =========================
   INPUT
   ========================= */
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

/* =========================
   GAME INIT
   ========================= */
function init() {
    canvas.width = 800;
    canvas.height = 600;
    generateMaze();
}

/* =========================
   START BUTTON
   ========================= */
startBtn.addEventListener('click', () => {
    if (audioCtx.state === 'suspended') audioCtx.resume();

    uiLayer.classList.add('hidden');
    hud.classList.remove('hidden');

    startTime = performance.now();
    isHardMode = false;

    generateMaze();

    player.x = TILE_SIZE * 3.5;
    player.y = TILE_SIZE * 4.5;
    monster.x = TILE_SIZE * 3.5;
    monster.y = TILE_SIZE * 2.5;

    monster.path = [];
    gracePeriodTimer = 3;

    gameState = 'PLAYING';
    lastTime = performance.now();
});

/* =========================
   GAME LOOP
   ========================= */
function loop(t) {
    const dt = Math.min((t - lastTime) / 1000, 0.1);
    update(dt);
    draw();
    lastTime = t;
    requestAnimationFrame(loop);
}

init();
requestAnimationFrame(loop);
</script>
</body>
</html>
